<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momen Spesialmu - Local Hunt Videobooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/localhunt.css?v=20260725">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: #e5f5e2 !important;
            background-image:
                linear-gradient(rgba(195, 225, 190, 0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(195, 225, 190, 0.6) 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
            font-family: 'Outfit', sans-serif;
            color: #1d3d29;
            height: auto !important;
            min-height: 100vh !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 48px;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }

        /* ── Floating Logo Capsule ── */
        .lh-logo-capsule {
            background: #fce3ec;
            padding: 10px 40px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(244, 185, 203, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            min-height: 58px;
        }
        .lh-logo-capsule img {
            max-height: 44px;
            width: auto;
            object-fit: contain;
        }

        /* ── Main White Card ── */
        .lh-card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
            padding: 44px 40px 36px;
            width: 100%;
            max-width: 820px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Pink Dash top-right */
        .lh-card::before {
            content: '';
            position: absolute;
            top: -2px; right: 28px;
            width: 60px; height: 5px;
            background: #f4999e;
            border-radius: 3px;
        }

        /* Wavy line separator */
        .lh-wave { margin: 10px 0 24px 0; }

        /* Greeting */
        .lh-greeting {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f4999e;
            margin-bottom: 4px;
        }
        .lh-username {
            font-size: 34px;
            font-weight: 900;
            color: #1d3d29;
            line-height: 1.1;
            margin-bottom: 6px;
        }
        .lh-sub {
            font-size: 15px;
            font-weight: 600;
            color: #4a7c59;
            margin-bottom: 24px;
        }

        /* Media Grid & Cards */
        .media-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
            margin-bottom: 24px;
        }

        .media-card {
            flex: 1;
            min-width: 240px;
            max-width: 320px;
            background: #fcf7ec;
            border-radius: 20px;
            overflow: hidden;
            border: 1.5px solid #e2ecc2;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .media-card video,
        .media-card img {
            width: 100%;
            max-height: 48vh;
            aspect-ratio: 9/16;
            object-fit: contain;
            background: #111;
            display: block;
        }

        .media-card-footer {
            padding: 12px 14px;
            background: #fcf7ec;
            margin-top: auto;
        }

        /* Dark Green Buttons */
        .btn-lh {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 18px;
            background: #1d3d29;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s;
            box-shadow: 0 6px 18px rgba(29,61,41,0.2);
        }
        .btn-lh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(29,61,41,0.3);
        }
        .btn-lh:active { transform: scale(0.98); }

        /* Footer text */
        .lh-footer {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1.5px solid #e2ecc2;
            font-size: 13px;
            font-weight: 700;
            color: #4a7c59;
        }

        /* Loading / Error */
        .lh-status {
            text-align: center;
            padding: 60px 20px;
        }
        .lh-status p {
            font-size: 18px;
            font-weight: 700;
            color: #1d3d29;
        }
        .lh-spinner {
            width: 44px; height: 44px;
            border: 4px solid #e2ecc2;
            border-top-color: #1d3d29;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-card {
            background: #ffffff;
            border: 2px solid #f4999e;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .error-card p { font-size: 16px; font-weight: 700; color: #c0392b; }

        .sparkle-top {
            position: absolute; top: 22px; right: 26px;
            opacity: 0.75; pointer-events: none;
        }

        /* ── Tablet & Small Laptop (Side-by-side Cards) ── */
        @media (min-width: 641px) {
            .media-grid {
                flex-direction: row;
            }
            .media-card {
                flex: 1;
                max-width: 350px;
            }
        }

        /* ── Mobile Devices (iPhone & Android Phones) ── */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px 32px !important;
            }
            .lh-logo-capsule {
                padding: 6px 24px;
                min-height: 46px;
                margin-bottom: 18px;
            }
            .lh-logo-capsule img {
                max-height: 34px;
            }
            .lh-card {
                padding: 24px 16px 20px !important;
                border-radius: 20px !important;
            }
            .lh-greeting {
                font-size: 11px;
                letter-spacing: 1.5px;
            }
            .lh-username {
                font-size: 26px !important;
                margin-bottom: 4px;
                word-break: break-word;
            }
            .lh-sub {
                font-size: 13px !important;
                margin-bottom: 16px;
            }
            .lh-wave {
                margin: 6px 0 18px 0;
                width: 140px;
                height: 16px;
            }
            .media-grid {
                flex-direction: column !important;
                gap: 18px !important;
                margin-bottom: 20px !important;
            }
            .media-card {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                border-radius: 16px !important;
            }
            .media-card video,
            .media-card img {
                width: 100% !important;
                max-height: 55vh !important;
                aspect-ratio: 9/16 !important;
                object-fit: contain !important;
            }
            .media-card-footer {
                padding: 10px 12px !important;
            }
            .btn-lh {
                padding: 14px 16px !important;
                font-size: 14px !important;
                border-radius: 12px !important;
            }
            .lh-footer {
                font-size: 11px !important;
                margin-top: 14px !important;
                padding-top: 14px !important;
            }
            .sparkle-top {
                width: 38px !important;
                height: 38px !important;
                top: 14px !important;
                right: 16px !important;
            }
        }

        /* ── Extra Small Mobile Phones (iPhone SE, Small Androids) ── */
        @media (max-width: 380px) {
            body { padding: 12px 8px 24px !important; }
            .lh-card { padding: 20px 12px 16px !important; }
            .lh-username { font-size: 22px !important; }
            .media-card video, .media-card img { max-height: 50vh !important; }
        }
    </style>
</head>
<body data-custom-page="true">

    <!-- Floating Pink Logo Capsule -->
    <div class="lh-logo-capsule" style="padding: 10px 24px; gap: 15px;">
        <img src="/LH.png" alt="Local Hunt Logo" style="height: 24px; max-width: 80px;">
        <div style="width: 1px; height: 18px; background: #e09ba5;"></div>
        <img src="/Lumea-black.png" alt="Lumea Logo" style="height: 20px; max-width: 80px;">
        <div style="width: 1px; height: 18px; background: #e09ba5;"></div>
        <img src="/imajiwalab.png" alt="Partner Logo" style="height: 24px; max-width: 80px;">
    </div>

    <!-- Top Screen Sparkle Doodle -->
    <div style="position:fixed;top:18px;right:28px;pointer-events:none;opacity:0.65;z-index:5;">
        <svg width="60" height="60" viewBox="0 0 50 50" fill="none">
            <path d="M25 0 C25 15 35 25 50 25 C35 25 25 35 25 50 C25 35 15 25 0 25 C15 25 25 15 25 0 Z"
                  stroke="#f4999e" stroke-width="2.5" fill="none"/>
        </svg>
    </div>

    <!-- Loading State -->
    <div id="loading" class="lh-card lh-status">
        <div class="lh-spinner"></div>
        <p>Loading your special moment... ✨</p>
    </div>

    <!-- Error State -->
    <div id="error" class="error-card" style="max-width:480px;width:100%;">
        <p>😕 Session not found or has expired.<br>Please contact the Local Hunt team.</p>
    </div>

    <!-- Content -->
    <div id="content" class="lh-card" style="display:none;">

        <!-- Sparkle deco inside card -->
        <svg class="sparkle-top" width="52" height="52" viewBox="0 0 50 50" fill="none">
            <path d="M25 0 C25 15 35 25 50 25 C35 25 25 35 25 50 C25 35 15 25 0 25 C15 25 25 15 25 0 Z"
                  stroke="#f4999e" stroke-width="2" fill="none"/>
        </svg>

        <!-- Greeting -->
        <p class="lh-greeting">Local Hunt Videobooth</p>
        <h1 class="lh-username" id="userName"></h1>
        <p class="lh-sub">Your memories are ready! Download them below 👇</p>

        <!-- Wavy line -->
        <svg class="lh-wave" width="180" height="20" viewBox="0 0 180 20" fill="none">
            <path d="M4 10 Q 45 2, 90 16 T 176 10" stroke="#f4999e" stroke-width="5" stroke-linecap="round"/>
        </svg>

        <!-- Media Grid -->
        <div class="media-grid">
            <div class="media-card" id="videoContainer" style="display:none;">
                <video id="videoElement" autoplay loop muted playsinline controls></video>
                <div class="media-card-footer">
                    <a id="videoDownload" href="#" target="_blank" class="btn-lh">🎬 Download Video</a>
                </div>
            </div>
            <div class="media-card" id="photoContainer" style="display:none;">
                <img id="photoElement" src="" alt="Local Hunt Photo">
                <div class="media-card-footer">
                    <a id="photoDownload" href="#" target="_blank" class="btn-lh">📸 Download Photo</a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="lh-footer">
            Thank you for participating in Local Hunt &mdash; Imajiwa Creative Studio
        </div>

        <!-- Pink dashes bottom-left deco -->
        <div style="position:absolute;left:24px;bottom:18px;display:flex;gap:5px;pointer-events:none;">
            <div style="width:18px;height:4px;background:#f4999e;border-radius:2px;"></div>
            <div style="width:12px;height:4px;background:#f4999e;border-radius:2px;opacity:0.6;"></div>
            <div style="width:8px;height:4px;background:#f4999e;border-radius:2px;opacity:0.35;"></div>
        </div>
    </div>

    <script src="/js/result.js"></script>
</body>
</html>
