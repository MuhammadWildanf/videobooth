<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Local Hunt Videobooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/localhunt.css?v=20260725">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #e5f5e2 !important;
            background-image:
                linear-gradient(rgba(195, 225, 190, 0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(195, 225, 190, 0.6) 1px, transparent 1px) !important;
            background-size: 24px 24px !important;
            font-family: 'Outfit', sans-serif;
            color: #1d3d29;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ── Top Floating Header Bar ── */
        .lh-top-bar {
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        /* Logo Capsule */
        .lh-logo-capsule {
            background: #fce3ec;
            padding: 8px 30px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(244, 185, 203, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.9);
            min-height: 52px;
        }
        .lh-logo-capsule img {
            max-height: 38px;
            width: auto;
            object-fit: contain;
        }

        /* Back to Booth Button */
        .btn-back-booth {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #1d3d29;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(29, 61, 41, 0.22);
        }
        .btn-back-booth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(29, 61, 41, 0.3);
        }

        /* ── Header Title Area ── */
        .lh-header-title {
            text-align: center;
            margin: 25px 0 20px;
            position: relative;
        }
        .lh-header-title h1 {
            font-size: 44px;
            font-weight: 900;
            color: #1d3d29;
            line-height: 1.05;
            letter-spacing: -0.5px;
        }
        .lh-header-title p {
            font-size: 15px;
            font-weight: 600;
            color: #4a7c59;
            margin-top: 8px;
        }

        /* ── Filter Controls ── */
        .lh-filter-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 90%;
            max-width: 520px;
            margin-bottom: 35px;
        }
        .lh-search-box {
            flex: 1;
            background: #ffffff;
            border-radius: 18px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border: 2px solid #e2ecc2;
            transition: border-color 0.2s;
        }
        .lh-search-box:focus-within {
            border-color: #1d3d29;
        }
        .lh-search-box input {
            width: 100%;
            border: none;
            outline: none;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #1d3d29;
            background: transparent;
            padding: 14px 0;
        }
        .lh-search-box input::placeholder {
            color: #9bb09e;
        }
        .btn-reset-filter {
            background: #ffffff;
            border: 2px solid #e2ecc2;
            color: #1d3d29;
            padding: 14px 20px;
            border-radius: 18px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transition: background 0.2s;
        }
        .btn-reset-filter:hover {
            background: #f8fcf7;
        }

        /* ── Gallery Grid ── */
        .lh-gallery-grid {
            width: 92%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
        }

        /* Guest Card (Support both JS class mappings) */
        .guest-card,
        .lh-guest-card {
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1.5px solid #e2ecc2;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .guest-card:hover,
        .lh-guest-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(29, 61, 41, 0.12);
        }

        .card-header,
        .lh-card-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1.5px solid #f2f7ef;
        }
        .guest-name,
        .lh-guest-name {
            font-size: 16px;
            font-weight: 800;
            color: #1d3d29;
        }
        .guest-date,
        .lh-guest-date {
            font-size: 12px;
            font-weight: 600;
            color: #4a7c59;
        }

        .media-panels,
        .lh-media-thumbs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #111111;
            gap: 1px;
            position: relative;
        }

        .media-thumb,
        .lh-thumb {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background: #111;
        }

        .media-thumb video,
        .media-thumb img,
        .lh-thumb video,
        .lh-thumb img {
            width: 100%;
            height: auto;
            max-height: 360px;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .media-thumb:hover video,
        .media-thumb:hover img,
        .lh-thumb:hover video,
        .lh-thumb:hover img {
            transform: scale(1.04);
        }

        .media-tag,
        .lh-tag {
            position: absolute;
            bottom: 8px; left: 8px;
            background: rgba(29, 61, 41, 0.9);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .play-overlay,
        .lh-play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            color: #1d3d29;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .card-actions,
        .lh-card-actions {
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            background: #fcf7ec;
            border-top: 1.5px solid #e2ecc2;
        }

        .btn-download,
        .btn-card-dl {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 14px;
            background: #1d3d29;
            color: #ffffff;
            border-radius: 14px;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 800;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 14px rgba(29,61,41,0.18);
        }
        .btn-download:hover,
        .btn-card-dl:hover {
            background: #2d5a3d;
            transform: translateY(-1px);
        }

        /* ── Status Messages ── */
        .status-message {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            font-weight: 700;
            color: #1d3d29;
        }
        .lh-spinner {
            width: 44px; height: 44px;
            border: 4px solid #e2ecc2;
            border-top-color: #1d3d29;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed; inset: 0;
            background: rgba(29, 61, 41, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center; justify-content: center;
        }
        .lightbox.open { display: flex; }
        .lightbox-content {
            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            max-width: 480px; width: 90%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            position: relative;
        }
        .lightbox-media video,
        .lightbox-media img {
            width: 100%; max-height: 68vh;
            object-fit: contain; display: block;
        }
        .lightbox-footer {
            padding: 18px 22px;
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1.5px solid #f2f7ef;
        }
        .lightbox-name { font-size: 16px; font-weight: 800; color: #1d3d29; }
        .lightbox-date { font-size: 12px; color: #9bb09e; margin-top: 2px; }
        .lightbox-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 12px 20px;
            background: #1d3d29; color: #ffffff;
            border-radius: 14px; text-decoration: none;
            font-size: 14px; font-weight: 800;
            transition: background 0.2s;
        }
        .lightbox-btn:hover { background: #2d5a3d; }
        .btn-close {
            position: absolute; top: 14px; right: 16px;
            background: rgba(0,0,0,0.08); border: none;
            width: 34px; height: 34px; border-radius: 50%;
            font-size: 20px; cursor: pointer; color: #1d3d29;
            display: flex; align-items: center; justify-content: center;
        }

        /* ── Footer ── */
        .lh-footer-text {
            text-align: center;
            padding: 20px 20px 40px;
            font-size: 13px;
            font-weight: 700;
            color: #4a7c59;
        }

        /* ── Tablet & Laptop Grid ── */
        @media (min-width: 641px) {
            .lh-gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            }
        }

        /* ── Mobile Devices (iPhone & Android Phones) ── */
        @media (max-width: 640px) {
            body {
                padding-bottom: 30px;
            }
            .lh-top-bar {
                padding: 12px 14px 0;
                justify-content: center !important;
            }
            .lh-logo-capsule {
                padding: 5px 18px;
                min-height: 42px;
            }
            .lh-logo-capsule img {
                max-height: 30px;
            }
            .lh-header-title {
                margin: 16px 0 16px;
                padding: 0 12px;
            }
            .lh-header-title h1 {
                font-size: 28px !important;
            }
            .lh-header-title p {
                font-size: 13px;
                margin-top: 4px;
            }
            .lh-filter-wrap {
                width: 94%;
                gap: 8px;
                margin-bottom: 22px;
            }
            .lh-search-box {
                padding: 0 14px;
                border-radius: 14px;
            }
            .lh-search-box input {
                font-size: 13px;
                padding: 10px 0;
            }
            .btn-reset-filter {
                padding: 10px 14px;
                font-size: 12px;
                border-radius: 14px;
                white-space: nowrap;
            }
            .lh-gallery-grid {
                width: 95%;
                grid-template-columns: 1fr !important;
                gap: 20px;
                margin-bottom: 35px;
            }
            .guest-card,
            .lh-guest-card {
                border-radius: 18px;
            }
            .card-header,
            .lh-card-header {
                padding: 12px 14px 10px;
            }
            .guest-name,
            .lh-guest-name {
                font-size: 15px;
            }
            .guest-date,
            .lh-guest-date {
                font-size: 11px;
            }
            .card-actions,
            .lh-card-actions {
                padding: 10px 12px;
                gap: 8px;
            }
            .btn-download,
            .btn-card-dl {
                padding: 10px 6px;
                font-size: 12px;
                border-radius: 12px;
            }
            .lightbox-content {
                width: 95%;
                border-radius: 22px;
            }
            .lightbox-media video,
            .lightbox-media img {
                max-height: 58vh;
            }
            .lightbox-footer {
                padding: 12px 16px;
            }
            .lightbox-btn {
                padding: 10px 16px;
                font-size: 13px;
                border-radius: 12px;
            }
        }

        /* ── Extra Small Phones (iPhone SE, etc.) ── */
        @media (max-width: 380px) {
            .lh-header-title h1 { font-size: 24px !important; }
            .btn-download, .btn-card-dl { font-size: 11px; padding: 8px 4px; }
            .lh-top-bar { padding: 10px 10px 0; }
        }
    </style>
</head>
<body data-custom-page="true">

    <!-- Top Floating Header Bar -->
    <div class="lh-top-bar" style="justify-content: center;">
        <!-- Floating Pink Logo Capsule -->
        <div class="lh-logo-capsule">
            <img src="/logo-localhunt.png" alt="LOCAL HUNT">
        </div>
    </div>

    <!-- Header Title Area -->
    <div class="lh-header-title">
        <!-- Top Sparkle Doodle -->
        <div style="position: absolute; top: -10px; right: 8%; opacity: 0.7; pointer-events: none;">
            <svg width="60" height="60" viewBox="0 0 50 50" fill="none">
                <path d="M25 0 C25 15 35 25 50 25 C35 25 25 35 25 50 C25 35 15 25 0 25 C15 25 25 15 25 0 Z"
                      stroke="#f4999e" stroke-width="2.5" fill="none"/>
            </svg>
        </div>

        <h1>Local Hunt<br>Memories ✨</h1>
        <svg width="200" height="22" viewBox="0 0 200 22" fill="none" style="margin-top: 6px;">
            <path d="M4 11 Q 50 2, 100 18 T 196 11" stroke="#f4999e" stroke-width="5.5" stroke-linecap="round"/>
        </svg>
        <p id="gallerySubtitle">A collection of memories from Local Hunt participants</p>
    </div>

    <!-- Search / Filter -->
    <div class="lh-filter-wrap">
        <div class="lh-search-box">
            <span style="font-size: 16px; margin-right: 10px; color: #9bb09e;">🔍</span>
            <input type="text" id="search-input" placeholder="Search your name..." oninput="filterGallery()">
        </div>
        <button class="btn-reset-filter" onclick="resetFilters()">Reset</button>
    </div>

    <!-- Gallery Grid -->
    <div class="lh-gallery-grid" id="gallery-grid">
        <div class="status-message" id="loading-state">
            <div class="lh-spinner"></div>
            <p>Loading memories... ✨</p>
        </div>
        <div class="status-message" id="empty-state" style="display:none;">
            <p>No memories found yet.</p>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="mediaLightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="btn-close" onclick="closeLightbox(event)">&times;</button>
            <div class="lightbox-media">
                <video id="lightboxVideo" style="display:none;" loop controls autoplay></video>
                <img id="lightboxImage" style="display:none;" src="" alt="Memory">
            </div>
            <div class="lightbox-footer">
                <div>
                    <div class="lightbox-name" id="lightboxName"></div>
                    <div class="lightbox-date" id="lightboxDate"></div>
                </div>
                <a href="#" id="lightboxDownloadBtn" target="_blank" class="lightbox-btn">📥 Download</a>
            </div>
        </div>
    </div>

    <!-- Page Footer -->
    <div class="lh-footer-text">
        Thank you for participating in Local Hunt &mdash; Imajiwa Creative Studio
    </div>

    <script src="/js/gallery.js"></script>
</body>
</html>
